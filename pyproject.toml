[project]
name = "libre-quant"
version = "0.1.0"
description = "个人量化研究：以 515880 通信ETF 为载体，做 PCF 持仓穿透与隔夜映射实证"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.32",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libre_quant"]

[dependency-groups]
dev = [
    "pytest>=8",
]
